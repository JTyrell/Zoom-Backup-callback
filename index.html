<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zoom Backup System — Signing In...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      text-align: center;
      padding: 48px 64px;
      background: #1a1d27;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.08);
      max-width: 440px;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(99,102,241,0.2);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin: 0 auto 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
    p  { font-size: 14px; color: rgba(255,255,255,0.5); line-height: 1.6; }
    .error { display: none; color: #f87171; margin-top: 16px; font-size: 14px; }
    .btn {
      display: none;
      margin-top: 20px;
      padding: 10px 24px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }
    .btn:hover { background: #4f46e5; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner" id="spinner"></div>
    <h1 id="title">Signing you in...</h1>
    <p id="subtitle">Redirecting back to Zoom Backup System.<br/>You can close this tab after the app opens.</p>
    <p class="error" id="error"></p>
    <button class="btn" id="openBtn" onclick="openApp()">Open Zoom Backup System</button>
  </div>

  <script>
    // Build the deep-link URI using Zoom's returned parameters
    const params = window.location.search; // e.g. ?code=abc&state=xyz
    const deepLink = 'zoombackup://callback' + params;

    function openApp() {
      window.location.href = deepLink;
    }

    function showError(msg) {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('title').textContent = 'Something went wrong';
      document.getElementById('subtitle').textContent = msg;
      document.getElementById('error').style.display = 'block';
      document.getElementById('openBtn').style.display = 'inline-block';
      document.getElementById('openBtn').textContent = 'Try Again';
      document.getElementById('openBtn').onclick = () => window.close();
    }

    // Check for error from Zoom
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('error')) {
      showError('Zoom reported: ' + (urlParams.get('error_description') || urlParams.get('error')));
    } else if (!urlParams.get('code')) {
      showError('No authorization code was received. Please try signing in again.');
    } else {
      // Attempt automatic redirect
      try {
        window.location.href = deepLink;
        // Show manual button after a short delay in case browser blocks the redirect
        setTimeout(() => {
          document.getElementById('spinner').style.display = 'none';
          document.getElementById('title').textContent = 'App is opening...';
          document.getElementById('subtitle').textContent = 'If the app did not open automatically, click the button below.';
          document.getElementById('openBtn').style.display = 'inline-block';
          document.getElementById('openBtn').textContent = 'Open Zoom Backup System';
          document.getElementById('openBtn').onclick = openApp;
        }, 1500);
      } catch (e) {
        showError('Could not open the app automatically. Please click the button below.');
      }
    }
  </script>
</body>
</html>
